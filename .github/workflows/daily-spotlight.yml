# Runs once a day: finds the most interesting new GitHub project built with Claude
# and updates app/data/spotlight.js, which the app shows as "Built with Claude today".
name: Daily Built-with-Claude spotlight

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-spotlight
  cancel-in-progress: false

jobs:
  spotlight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scripts/daily-spotlight
        run: npm install --no-audit --no-fund

      - name: Find today's project
        working-directory: scripts/daily-spotlight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Add this secret to get a plain-English explanation written by Claude.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node index.mjs

      - name: Save the result
        run: |
          if git diff --quiet -- app/data/spotlight.js; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add app/data/spotlight.js
          git commit -m "Update daily Built-with-Claude spotlight"
          git push
